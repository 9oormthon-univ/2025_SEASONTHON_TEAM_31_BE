# version 키는 제거 OK

services:
  mysql:
    image: mysql:8.0
    container_name: growme-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: growme-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    # GIT_SHA 미설정 경고가 싫다면 고정 태그로 바꾸세요 (예: dev-latest)
    image: docker.io/juheunshim/growme-be:dev-${GIT_SHA}
    container_name: growme-app
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

volumes:
  mysql_data: