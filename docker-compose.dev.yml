# version 키는 제거 OK

services:
  mysql:
    image: mysql:8.0
    container_name: growme-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"           # 외부 공개가 불필요하면 "127.0.0.1:3306:3306" 권장
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: growme-redis
    ports:
      - "6379:6379"           # 불필요하면 "127.0.0.1:6379:6379" 권장
    restart: unless-stopped

  app:
    image: docker.io/juheunshim/growme-be:dev-${GIT_SHA}   # ← Docker Hub 경로(소문자)
    container_name: growme-app
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

volumes:
  mysql_data: