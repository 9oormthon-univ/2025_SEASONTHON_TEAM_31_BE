<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>고민 상담 챗봇</title>
    <style>
        /* 간단한 스타일링 */
        #chat-window { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; }
        .message { margin-bottom: 10px; }
        .user { text-align: right; color: blue; }
        .bot { text-align: left; color: green; }
    </style>
</head>
<body>
<h1>고민 상담 챗봇</h1>
<div id="chat-window"></div>
<input type="text" id="message-input" placeholder="고민을 입력하세요..." size="50">
<button onclick="sendMessage()">전송</button>

<script>
    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');

    async function sendMessage() {
        const message = messageInput.value;
        if (!message) return;

        // 사용자 메시지 표시
        addMessage(message, 'user');
        messageInput.value = '';

        try {
            // 백엔드 API 호출
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            if (!response.ok) {
                throw new Error('서버 오류가 발생했습니다.');
            }

            const data = await response.json();

            // 봇 응답 표시
            addMessage(data.response, 'bot');

        } catch (error) {
            addMessage('오류: ' + error.message, 'bot');
        }
    }

    function addMessage(text, sender) {
        const messageElement = document.createElement('div');
        messageElement.className = 'message ' + sender;
        messageElement.textContent = text;
        chatWindow.appendChild(messageElement);
        chatWindow.scrollTop = chatWindow.scrollHeight; // 항상 마지막 메시지로 스크롤
    }
</script>
</body>
</html>
