name: Deploy to EC2 (dev) via Docker Hub

on:
  push:
    branches: ["dev"]
    paths:
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "src/**"
      - "Dockerfile"
      - "docker-compose.dev.yml"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_REPO: docker.io/juheunshim/growme-be
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show disk usage (before build)
        run: |
          df -h
          docker system df || true

      - name: Setup JDK 17 (with Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build (bootJar)
        run: |
          ./gradlew \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true \
            clean bootJar -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container
          driver-opts: image=moby/buildkit:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:dev-${{ env.GIT_SHA }}
            ${{ env.DOCKERHUB_REPO }}:dev-latest
          cache-from: |
            type=gha
            type=registry,ref=${{ env.DOCKERHUB_REPO }}:dev-cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.DOCKERHUB_REPO }}:dev-cache,mode=max,compression=zstd
          provenance: false
          sbom: false

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          envs: GIT_SHA,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            cd /home/ubuntu/growme

            echo "Docker login (EC2)"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "Pull new image"
            docker compose -f docker-compose.dev.yml pull --quiet app

            echo "Restart only app service"
            docker compose -f docker-compose.dev.yml up -d --no-deps --force-recreate app

            echo "Prune old images"
            docker image prune -f --filter "until=24h" || true

      - name: Clean up Docker images (runner)
        run: |
          docker system prune -af
          df -h