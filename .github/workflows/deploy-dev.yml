name: Deploy to EC2 (dev) via Docker Hub

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_REPO: docker.io/juheunshim/growme-be
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk usage (before)
        run: |
          df -h || true
          docker system df || true

      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build (bootJar)
        run: ./gradlew clean bootJar -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:dev-${{ env.GIT_SHA }}
            ${{ env.DOCKERHUB_REPO }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup docker (after)
        if: always()
        run: |
          docker system prune -af || true
          docker builder prune -af || true
          df -h || true

      # EC2에 접속해 deploy-dev.sh 실행 (compose pull & up)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}      # 예: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}        # -----BEGIN ... END----- 전체
          port: 22
          script_stop: true
          command_timeout: 30m
          envs: GIT_SHA,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            cd /home/ubuntu/growme
            ./deploy-dev.sh "${{ env.GIT_SHA }}"