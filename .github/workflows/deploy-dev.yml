jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_REPO: docker.io/juheunshim/growme-be
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 1) 디스크 공간 확보
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true  # 빌드 전에 지워도 OK (어차피 새로 받음)

      # (선택) 현재 여유 확인
      - name: Show disk usage (before build)
        run: |
          df -h
          docker system df || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # (선택) 여유가 빠듯하면 Gradle 캐시 잠깐 끄세요. 사용 시에는 그대로 두세요.
      # - name: Cache Gradle
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #     key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      #     restore-keys: ${{ runner.os }}-gradle-

      # 멀티스테이지 Dockerfile이면 이 스텝(bootJar)은 생략 가능
      - name: Build (bootJar)
        run: ./gradlew clean bootJar -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2) Docker 레이어 캐시를 GHA로 사용
      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:dev-${{ env.GIT_SHA }}
            ${{ env.DOCKERHUB_REPO }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          envs: GIT_SHA,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            cd /home/ubuntu/growme
            ./deploy-dev.sh "${{ env.GIT_SHA }}"